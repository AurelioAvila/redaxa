<!-- Small-size variant of Lock Pup, for anywhere it renders at 48px or
     below (browser toolbar, favicon, taskbar). The full-detail mark in
     redaxa-icon.svg loses its face entirely by 16px — eye, wink, blush and
     keyhole slot all merge into a grey smear. This version drops the
     blush (the first thing to die), thickens every remaining stroke, and
     simplifies the keyhole to one bold shape, so the face still reads as
     a face at real toolbar size. Keep both files in sync on layout/color;
     this one only ever changes stroke weight and which details survive. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5637c9"/>
      <stop offset="100%" stop-color="#2a1668"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="120" fill="url(#bg)"/>

  <path d="M196 216 v-28 a60 60 0 0 1 120 0 v28" fill="none" stroke="#f4f3ef" stroke-width="30" stroke-linecap="round"/>
  <rect x="150" y="206" width="212" height="180" rx="46" fill="#f4f3ef"/>

  <!-- Eye and wink, both bigger and bolder than the detailed version. -->
  <circle cx="212" cy="280" r="20" fill="#14092e"/>
  <rect x="270" y="270" width="44" height="20" rx="10" fill="#14092e"/>

  <!-- Keyhole simplified to one bold silhouette instead of circle + slot -->
  <path d="M256 306 a17 17 0 0 1 10 31 l6 26 h-32 l6 -26 a17 17 0 0 1 10 -31 z" fill="#14092e"/>
</svg>
