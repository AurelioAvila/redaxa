<svg viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f0c"/>
      <stop offset="100%" stop-color="#141712"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#b9ff00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b9ff00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- shield mark -->
  <g transform="translate(64,150)">
    <path d="M60 0 L118 22 V78 C118 122 90 156 60 170 C30 156 2 122 2 78 V22 Z"
          fill="none" stroke="#b9ff00" stroke-width="4"/>
    <path d="M38 86 L54 102 L86 62" fill="none" stroke="#b9ff00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="230" y="168" fill="#f4f6f1" font-size="58" font-weight="800" letter-spacing="-1.5">PromptShield</text>
  <text x="232" y="206" fill="#9da49a" font-size="21" font-weight="500">Catch what you're about to leak, before it leaves.</text>

  <!-- mock redaction card -->
  <g transform="translate(230,236)" filter="url(#soft)">
    <rect width="620" height="118" rx="14" fill="#15170f" stroke="#2b3128" stroke-width="1.5"/>
    <text x="24" y="34" fill="#6d746a" font-size="13" font-weight="700" letter-spacing="1">BEFORE</text>
    <text x="24" y="58" fill="#c9c9c9" font-size="16">Hi, my email is aurelio.avila</text>
    <text x="24" y="80" fill="#c9c9c9" font-size="16">@company.com, card 4111 1111 1111 1111</text>
    <line x1="24" y1="96" x2="596" y2="96" stroke="#2b3128" stroke-width="1"/>
    <text x="24" y="112" fill="#6d746a" font-size="13" font-weight="700" letter-spacing="1">AFTER</text>
  </g>
  <g transform="translate(254,325)">
    <text x="0" y="0" fill="#b9ff00" font-size="16" font-weight="700">Hi, my email is [EMAIL], card [CARD]</text>
  </g>

  <!-- category chips -->
  <g transform="translate(880,150)" font-size="14" font-weight="700">
    <g transform="translate(0,0)">
      <rect width="150" height="34" rx="17" fill="none" stroke="#3d4b34"/>
      <text x="75" y="22" fill="#b9ff00" text-anchor="middle">Personal data</text>
    </g>
    <g transform="translate(0,46)">
      <rect width="150" height="34" rx="17" fill="none" stroke="#3d4b34"/>
      <text x="75" y="22" fill="#b9ff00" text-anchor="middle">Credentials</text>
    </g>
    <g transform="translate(0,92)">
      <rect width="150" height="34" rx="17" fill="none" stroke="#3d4b34"/>
      <text x="75" y="22" fill="#b9ff00" text-anchor="middle">Financial data</text>
    </g>
    <g transform="translate(0,138)">
      <rect width="150" height="34" rx="17" fill="none" stroke="#3d4b34"/>
      <text x="75" y="22" fill="#b9ff00" text-anchor="middle">Custom terms</text>
    </g>
  </g>

  <text x="64" y="392" fill="#5c635a" font-size="14">Web · Windows desktop · Chrome extension</text>
</svg>
